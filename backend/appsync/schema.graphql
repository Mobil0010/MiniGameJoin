enum RoomStatus {
  waiting
  ready
  playing
  finished
  cancelled
}

enum ScoreCategory {
  ones
  twos
  threes
  fours
  fives
  sixes
  choice
  fourOfAKind
  fullHouse
  smallStraight
  largeStraight
  yacht
}

enum MatchFinishReason {
  completed
  forfeit
  disconnectTimeout
}

enum MatchResult {
  win
  loss
  draw
}

enum ChatChannel {
  lobby
  game
}

enum FriendRequestDecision {
  accept
  reject
}

type UserProfile {
  userId: ID!
  email: AWSEmail!
  nickname: String!
  wins: Int!
  losses: Int!
  winRate: Float!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type ScoreEntry @aws_cognito_user_pools @aws_iam {
  category: ScoreCategory!
  score: Int!
}

type RoomPlayer @aws_cognito_user_pools @aws_iam {
  userId: ID!
  nickname: String!
  isHost: Boolean!
  isReady: Boolean!
  slot: Int
  isPlaying: Boolean
  scores: [ScoreEntry!]!
}

type Die @aws_cognito_user_pools @aws_iam {
  id: Int!
  value: Int
  isHeld: Boolean!
}

type Room @aws_cognito_user_pools @aws_iam {
  roomCode: ID!
  gameId: String!
  status: RoomStatus!
  players: [RoomPlayer!]!
  activePlayerId: ID
  dice: [Die!]!
  rollCount: Int!
  version: Int!
  winnerId: ID
  finishReason: MatchFinishReason
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  expiresAt: AWSTimestamp!
}

type ChatMessage @aws_cognito_user_pools @aws_iam {
  id: ID!
  roomCode: ID!
  senderId: ID!
  senderNickname: String!
  channel: ChatChannel!
  text: String!
  sentAt: AWSDateTime!
}

type FriendSummary {
  userId: ID!
  nickname: String!
  isOnline: Boolean!
  lastSeenAt: AWSDateTime
  invitedRoomCode: ID
}

type FriendRequest {
  userId: ID!
  nickname: String!
  requestedAt: AWSDateTime!
}

type FriendDashboard {
  friends: [FriendSummary!]!
  incomingRequests: [FriendRequest!]!
}

type UserSearchResult {
  userId: ID!
  nickname: String!
}

type MatchHistoryItem {
  matchId: ID!
  roomCode: ID!
  result: MatchResult!
  reason: MatchFinishReason!
  myScore: Int!
  opponentScore: Int!
  opponentNickname: String!
  finishedAt: AWSDateTime!
}

type MatchHistoryPage {
  items: [MatchHistoryItem!]!
  nextToken: String
}

type MatchPlayer {
  userId: ID!
  nickname: String!
  slot: Int!
  totalScore: Int!
  scores: [ScoreEntry!]!
}

type MatchDetail {
  matchId: ID!
  roomCode: ID!
  result: MatchResult!
  reason: MatchFinishReason!
  winnerId: ID
  players: [MatchPlayer!]!
  finishedAt: AWSDateTime!
}

type Query {
  me: UserProfile!
  room(roomCode: ID!): Room! @aws_cognito_user_pools @aws_iam
  listChatMessages(roomCode: ID!, channel: ChatChannel!, limit: Int): [ChatMessage!]!
    @aws_cognito_user_pools
    @aws_iam
  friendDashboard: FriendDashboard!
  searchMembers(query: String!): [UserSearchResult!]!
  myMatchHistory(limit: Int, nextToken: String): MatchHistoryPage!
  matchDetail(matchId: ID!): MatchDetail!
}

type Mutation {
  ensureProfile(nickname: String!): UserProfile!
  updateNickname(nickname: String!): UserProfile!
  deleteMyProfile: Boolean!

  createRoom(guestNickname: String): Room!
    @aws_cognito_user_pools
    @aws_iam
  joinRoom(roomCode: ID!, guestNickname: String): Room!
    @aws_cognito_user_pools
    @aws_iam
  leaveRoom(roomCode: ID!, expectedVersion: Int!): Room!
    @aws_cognito_user_pools
    @aws_iam
  setReady(roomCode: ID!, ready: Boolean!, expectedVersion: Int!): Room!
    @aws_cognito_user_pools
    @aws_iam
  startGame(roomCode: ID!, expectedVersion: Int!): Room!
    @aws_cognito_user_pools
    @aws_iam
  selectPlayers(
    roomCode: ID!
    playerIds: [ID!]!
    expectedVersion: Int!
  ): Room! @aws_cognito_user_pools @aws_iam

  rollDice(
    roomCode: ID!
    heldIndexes: [Int!]!
    expectedVersion: Int!
  ): Room! @aws_cognito_user_pools @aws_iam
  confirmScore(
    roomCode: ID!
    category: ScoreCategory!
    expectedVersion: Int!
  ): Room! @aws_cognito_user_pools @aws_iam
  forfeit(roomCode: ID!, expectedVersion: Int!): Room!
    @aws_cognito_user_pools
    @aws_iam
  returnToWaitingRoom(roomCode: ID!, expectedVersion: Int!): Room!
    @aws_cognito_user_pools
    @aws_iam

  heartbeat(roomCode: ID!): Boolean! @aws_cognito_user_pools @aws_iam
  claimDisconnectWin(roomCode: ID!, expectedVersion: Int!): Room!
    @aws_cognito_user_pools
    @aws_iam
  sendChatMessage(roomCode: ID!, channel: ChatChannel!, text: String!): ChatMessage!
    @aws_cognito_user_pools
    @aws_iam

  touchPresence: Boolean!
  sendFriendRequest(userId: ID!): Boolean!
  respondFriendRequest(userId: ID!, decision: FriendRequestDecision!): Boolean!
  removeFriend(userId: ID!): Boolean!
  inviteFriendToRoom(roomCode: ID!, friendUserId: ID!): Boolean!
}

type Subscription {
  onRoomChanged(roomCode: ID!): Room
    @aws_cognito_user_pools
    @aws_iam
    @aws_subscribe(
      mutations: [
        "joinRoom"
        "leaveRoom"
        "setReady"
        "selectPlayers"
        "startGame"
        "rollDice"
        "confirmScore"
        "forfeit"
        "returnToWaitingRoom"
        "claimDisconnectWin"
      ]
    )
  onChatMessage(roomCode: ID!, channel: ChatChannel!): ChatMessage
    @aws_cognito_user_pools
    @aws_iam
    @aws_subscribe(mutations: ["sendChatMessage"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
